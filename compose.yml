services:
  db:
    container_name: portfolio-db
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # no arm64 image; runs via Rosetta on Apple Silicon
    ports:
      - "1434:1433" # host port 1434, since 1433 is used by the course's sql1 container
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  api:
    container_name: portfolio-api
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=db,1433;Database=Portfolio;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
